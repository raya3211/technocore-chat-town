<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Chat Room — Chat Is Alive</title>
  <meta name="description" content="Technocore chat with walking pixel characters and speech bubbles." />
  <meta name="theme-color" content="#0a1628" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="live-dot"></span>
        <h1>CHAT IS ALIVE</h1>
      </div>
      <div class="top-controls">
        <label class="field-inline">
          <span>Room</span>
          <input id="room" type="text" value="lobby" spellcheck="false" maxlength="48" />
        </label>
        <button type="button" class="btn" id="btn-join-room">Enter</button>
        <span class="status" id="status">offline</span>
      </div>
    </header>

    <div class="stage-wrap">
      <div class="sky"></div>
      <div class="buildings" aria-hidden="true"></div>
      <div class="stage" id="stage">
        <!-- characters injected here -->
      </div>
      <div class="ground"></div>
      <div class="join-overlay" id="join-overlay">
        <div class="join-card">
          <p class="join-title">Pick your character</p>
          <p class="join-sub">Nickname becomes your pixel walker in the room.</p>
          <input id="nick" type="text" maxlength="20" placeholder="nickname" spellcheck="false" />
          <div class="palette" id="palette"></div>
          <button type="button" class="btn primary" id="btn-join">Walk in</button>
        </div>
      </div>
    </div>

    <div class="dock">
      <div class="who" id="who">Not joined</div>
      <form class="compose" id="compose">
        <input id="msg" type="text" maxlength="200" placeholder="Say something…" autocomplete="off" disabled />
        <button type="submit" class="btn primary" id="btn-send" disabled>Send</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
